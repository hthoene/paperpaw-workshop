[package]
name = "paperpaw-workshop"
version = "0.1.0-beta.4"
description = "Make PaperPaw plugins with AI, on your own computer"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "paperpaw_workshop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The key in the system's own keychain: Windows Credential Manager, the
# macOS Keychain, the Secret Service on Linux.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
dirs = "6"
base64 = "0.22"
png = "0.17"
# Pictures for plugins, made smaller on the computer (pictures.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
oxipng = { version = "9", default-features = false, features = ["parallel"] }
# Choosing where a plugin goes (a zip, a reader's card).
tauri-plugin-dialog = "2"
# Opening the store's upload form in the browser, showing a package in its folder.
tauri-plugin-opener = "2"
# Sending a plugin to a reader over Wi-Fi (its transfer page's API).
ureq = { version = "2", default-features = false, features = ["tls"] }
# Its addresses checked before an example is fetched (sample.rs).
url = "2"
# Sending a plugin to a reader over the USB cable (usb.rs).
serialport = "4.10"
# The app's own updates (updates.rs): fetched from the workshop's GitHub
# releases, installed only when signed with its update key; then the app
# starts again.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Projects put in the bin, not deleted (they can be got back).
trash = "5"
# The author key that signs plugins with code, as paperpaw-native does (author.rs).
ed25519-compact = { version = "2.6", default-features = false, features = ["random"] }
# The source of a plugin with code as a ZIP for the store's form (device.rs).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Checking what is downloaded (rustup) before it runs.
sha2 = "0.10"
# The projects' history (history.rs): a Git repository of each project's
# own, through libgit2 built into the app, so no Git is needed.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

[dev-dependencies]
tempfile = "3"

# Pictures are made in this process (image, oxipng): optimised even in
# debug builds, the workshop's own code left quick to build. PaperPaw's
# emulator and checks are a program of their own (emulator.rs).
[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 3
