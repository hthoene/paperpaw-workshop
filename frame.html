<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Its Content-Security-Policy comes from the server (local/nginx.conf):
         in a sandbox without allow-same-origin the frame's origin is opaque,
         so 'self' would match nothing; the server names its real origin. -->
    <title>Emulator</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f2f2f2; }
      body { display: grid; place-items: center; }
      canvas { display: block; max-width: 100%; max-height: 100%; image-rendering: auto; }
    </style>
  </head>
  <body>
    <canvas id="screen" width="480" height="800"></canvas>
    <script type="module" src="/src/emulator/frame/main.ts"></script>
  </body>
</html>
