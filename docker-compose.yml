# The workshop on your own computer, at http://localhost:8080
#
#   docker compose up --build
#
# Your Claude key stays in your browser: this container only serves the
# workshop's pages, it never sees the key or your plugins.
services:
  workshop:
    build: .
    ports:
      - "127.0.0.1:${WORKSHOP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  # Plugins with code: PaperPaw's web emulator built with the plugin in it,
  # and the plugin as a file for the X4 (builder/Dockerfile). The workshop
  # reaches it at /api/v1/workshop/builds; npm run dev at this port.
  builder:
    build:
      context: .
      dockerfile: builder/Dockerfile
    ports:
      - "127.0.0.1:${BUILDER_PORT:-8090}:8090"
    restart: unless-stopped
    cpus: 2
    mem_limit: 4g
    pids_limit: 512
