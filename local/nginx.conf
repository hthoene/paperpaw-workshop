# The workshop as static files. The page talks to itself and to Anthropic
# only; the emulator frame runs in a sandbox of its own (opaque) origin,
# so its scripts load with CORS and its policy names this server's origin.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    # Nothing about who asked is kept: no access log.
    access_log off;

    location = /frame.html {
        add_header Content-Security-Policy "default-src 'none'; script-src $scheme://$http_host; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-cache always;
    }

    location /assets/ {
        # Asked for by the emulator frame, whose origin is opaque ("null").
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.anthropic.com; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }
}
