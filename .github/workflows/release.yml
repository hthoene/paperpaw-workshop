# The workshop's release check, on a tag v<version> (the version of
# src-tauri/tauri.conf.json, e.g. v0.1.0-beta.1): the tag is the app's
# version, PaperPaw's emulator and paperpaw-dev of the release
# paperpaw-release.txt names are there and hold (checksum and signature by
# PaperPaw's release key, scripts/paperpaw-release.mjs), the notices are
# complete and the tests pass.
#
# The release itself is made on the maintainer's computer with
# scripts/release-local.mjs: the installer is Authenticode-signed with a
# certificate whose key never leaves Certum's cloud, then signed for the
# workshop's updates, and only then released with its signature and
# latest.json. GitHub's runners can do neither.
#
# Windows only for now. PaperPaw's releases have emulators for macOS and
# Linux too; their installers can follow as jobs of their own.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Release check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: The tag is the app's version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          conf="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          if [[ "$version" != "$conf" ]]; then
            echo "::error::the tag is $GITHUB_REF_NAME, src-tauri/tauri.conf.json says $conf"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PAPERPAW=$(tr -d '[:space:]' < paperpaw-release.txt)" >> "$GITHUB_ENV"
      - name: PaperPaw's emulator, from its release, checked
        shell: pwsh
        run: |
          $zip = node scripts/paperpaw-release.mjs $env:PAPERPAW windows-x64 "$env:RUNNER_TEMP/paperpaw"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP/paperpaw/bin"
          Add-Content -Path $env:GITHUB_ENV -Value "PAPERPAW_EMU=$env:RUNNER_TEMP/paperpaw/bin/paperpaw-emu.exe"
      # paperpaw-sign packs plugins with code for the readers (Publish…).
      # Taken from the release where its emulator zip has it; until then
      # built from the release's tag.
      - name: paperpaw-sign of that release
        shell: bash
        run: |
          bin="$RUNNER_TEMP/paperpaw/bin"
          if [[ ! -f "$bin/paperpaw-sign.exe" ]]; then
            cargo install --locked --git https://github.com/hthoene/paperpaw --tag "v$PAPERPAW" \
              paperpaw-sign --root "$RUNNER_TEMP/sign"
            cp "$RUNNER_TEMP/sign/bin/paperpaw-sign.exe" "$bin/"
          fi
      - run: npm ci
      # Every dependency that ships has its notice (scripts/notices.mjs).
      - run: npm run notices:check
      - run: npm run build
      - run: npm test
      # Build from the registry SDK selected by the real emulator, then
      # load the plugin in it. No checkout SDK may hide missing crates.
      - name: Rust checks and plugins against the released SDK
        env:
          PAPERPAW_RUST: system
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --test-threads=1
